# Simple workflow for deploying static content to GitHub Pages
name: Deploy

on:
  # Runs on pushes to main
  push:
    branches:
      -  main
  # and optionally run on a schedule
  schedule: 
    # for those that don't speak cron, this should try to run 23 minutes past the hour, every 3rd hour of the day.
    - cron: '23 0,3,6,9,12,15,18,21 * * *'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, and cancel any in-progress deployments if a new one is triggered
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}      
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # main
        with:
          # Using fetch-depth: 0 to ensure we get the full history of the repository
          fetch-depth: 0
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # main
      - name: Build Pages
        shell: pwsh
        run: ./psturtle.com/build.ps1
      - name: Upload artifact
        uses: actions/upload-pages-artifact@98ef48e41587a300b82de4cf298aa98b57b2faae # main
        with:
          # Upload the contents of the domain directory to the GitHub Pages artifact
          path: './psturtle.com/'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # main
