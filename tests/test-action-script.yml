name: Test ActionScript input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true
      - name: Configure git
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
      - id: action
        uses: .
        with:
          Run: |
            Write-Host "ActionScript test: inline script runs alongside ActionScript input"
          ActionScript: "*.Turtle.ps1"
          SkipScriptFile: "true"
          NoPush: "true"
          NoCommit: "true"
          GitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Assert action completed successfully
        run: |
          echo "Action completed without error"
          echo "PASS"
