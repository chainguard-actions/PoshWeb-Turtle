name: Test ActionScript input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/act-harness
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true
      - name: Configure git identity
        run: |
          git config --global user.email "test@example.com"
          git config --global user.name "Test User"
      - id: action
        uses: .
        with:
          ActionScript: "*.Turtle.ps1"
          SkipScriptFile: "true"
          NoPush: "true"
          NoCommit: "true"
          UserEmail: "test@example.com"
          UserName: "testuser"
      - name: Assert action completed
        run: |
          echo "Action completed successfully with ActionScript input"
          echo "PASS"
