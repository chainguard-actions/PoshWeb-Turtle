name: Test ActionScript input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/act-harness
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          ActionScript: "*nonexistent*.Turtle.ps1"
          NoPush: "true"
          NoCommit: "true"
          SkipScriptFile: "true"
      - name: Assert action completed
        run: |
          echo "Action completed successfully with ActionScript input"
          echo "PASS"
