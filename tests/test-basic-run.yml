name: Test basic Run input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Install PowerShell if not available
        run: |
          if ! command -v pwsh &>/dev/null; then
            echo "Installing PowerShell..."
            wget -q "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"
            sudo dpkg -i packages-microsoft-prod.deb
            sudo apt-get update -q
            sudo apt-get install -y powershell
          else
            echo "pwsh already available: $(pwsh --version)"
          fi

      - name: Set up git and origin reachable for git pull
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          git config pull.rebase false
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"
          git fetch origin
          git branch --set-upstream-to=origin/act-harness act-harness 2>/dev/null || true

      - id: action
        uses: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: github-actions[bot]
          GITHUB_ACTOR_ID: "41898282"
        with:
          Run: |
            Write-Host "Hello from Turtle PowerShell!"
            "Turtle script ran successfully" | Out-Host
          NoPush: "true"
          NoCommit: "true"
          UserEmail: "test@example.com"
          UserName: "Test User"
          GitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert action completed without error
        run: |
          echo "Action step completed successfully"
          echo "PASS"
