name: Test InstallModule input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true

      - name: Configure git identity
        run: |
          git config --global user.email "test@example.com"
          git config --global user.name "Test User"

      - id: action
        uses: .
        with:
          # Install a small, well-known module from the PowerShell Gallery
          InstallModule: "PowerShellGet"
          SkipScriptFile: "true"
          NoPush: "true"
          NoCommit: "true"
          GitHubToken: ${{ github.token }}

      - name: Assert action completed with InstallModule
        run: |
          echo "InstallModule input was accepted and action completed"
          echo "PASS"
