name: Test InstallModule input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/act-harness
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          InstallModule: "Pester"
          SkipScriptFile: "true"
          NoPush: "true"
          NoCommit: "true"
          UserName: "test-user"
          UserEmail: "test-user@noreply.github.com"
      - name: Assert action completed with InstallModule
        run: |
          echo "Action completed with InstallModule input"
          echo "PASS"
