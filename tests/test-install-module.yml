name: Test InstallModule input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true
      - name: Configure git identity
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
      - id: action
        uses: .
        with:
          Run: |
            Write-Host "InstallModule test: module installation complete"
          InstallModule: "PowerShellGet"
          SkipScriptFile: 'true'
          NoPush: 'true'
          NoCommit: 'true'
          UserEmail: "test@example.com"
          UserName: "TestUser"
      - name: Assert action completed successfully
        run: |
          echo "Action completed with InstallModule input"
          echo "PASS"
