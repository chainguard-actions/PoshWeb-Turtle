name: Test SkipScriptFile input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/act-harness
      GITHUB_ACTOR: test-user
      GITHUB_ACTOR_ID: ""
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install PowerShell
        run: |
          which pwsh || (apt-get update -y && apt-get install -y powershell)
      - name: Configure git remote so git pull succeeds
        run: |
          git config --global user.email "test@example.com"
          git config --global user.name "test-user"
          git init --bare /tmp/test-remote.git
          git remote remove origin 2>/dev/null || true
          git remote add origin /tmp/test-remote.git
          git push --set-upstream origin act-harness
      - name: Create a Turtle script file that should be skipped
        run: |
          echo 'throw "This script should have been skipped!"' > "$GITHUB_WORKSPACE/should-be-skipped.Turtle.ps1"
      - id: action
        uses: .
        with:
          SkipScriptFile: "true"
          NoPush: "true"
          NoCommit: "true"
          UserEmail: "test@example.com"
          UserName: "test-user"
      - name: Assert action completed without running script files
        run: |
          echo "Action completed with SkipScriptFile=true"
          echo "PASS"
