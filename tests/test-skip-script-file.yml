name: Test SkipScriptFile input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install PowerShell if needed
        run: |
          if ! command -v pwsh &>/dev/null; then
            apt-get update -qq 2>/dev/null || sudo apt-get update -qq
            apt-get install -y -qq powershell 2>/dev/null || sudo apt-get install -y -qq powershell
          fi
          pwsh --version

      - name: Set up git origin reachable inside the action
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"
          # Set up tracking so git pull works
          CURRENT_BRANCH=$(git symbolic-ref --short HEAD 2>/dev/null || echo "act-harness")
          git fetch origin
          git branch --set-upstream-to="origin/$CURRENT_BRANCH" "$CURRENT_BRANCH" 2>/dev/null || true

      - name: Create a marker file to detect if Turtle.ps1 scripts run
        run: |
          # Create a .Turtle.ps1 file that would write a marker if executed
          cat > "$GITHUB_WORKSPACE/ShouldBeSkipped.Turtle.ps1" << 'EOF'
          "TURTLE_SCRIPT_RAN" | Out-File -FilePath "$env:GITHUB_WORKSPACE/turtle_ran.txt"
          EOF

      - name: Run action with SkipScriptFile=true
        id: action
        uses: .
        with:
          SkipScriptFile: 'true'
          NoPush: 'true'
          NoCommit: 'true'
          UserEmail: 'test@example.com'
          UserName: 'test-user'

      - name: Assert Turtle.ps1 scripts were skipped
        run: |
          if [ -f "$GITHUB_WORKSPACE/turtle_ran.txt" ]; then
            echo "FAIL: Turtle.ps1 script ran despite SkipScriptFile=true"
            exit 1
          fi
          echo "PASS: Turtle.ps1 scripts were skipped as expected"
