name: Test SkipScriptFile input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true

      - name: Install PowerShell
        run: |
          wget -q "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb" -O /tmp/packages-microsoft-prod.deb 2>/dev/null || true
          if [ -f /tmp/packages-microsoft-prod.deb ]; then
            dpkg -i /tmp/packages-microsoft-prod.deb 2>/dev/null || true
            apt-get update -qq 2>/dev/null || true
            apt-get install -y -qq powershell 2>/dev/null || true
          fi
          if ! command -v pwsh &>/dev/null; then
            snap install powershell --classic 2>/dev/null || true
          fi
          pwsh --version

      - name: Set up git origin reachable inside the action
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"
          git fetch origin
          git branch --set-upstream-to=origin/act-harness act-harness 2>/dev/null || \
            git branch -u origin/act-harness 2>/dev/null || true

      - name: Create a Turtle script file that should be skipped
        run: |
          cat > "$GITHUB_WORKSPACE/test.Turtle.ps1" << 'EOF'
          Write-Host "This should be skipped"
          exit 1
          EOF

      - id: action
        uses: .
        with:
          SkipScriptFile: "true"
          NoPush: "true"
          NoCommit: "true"
          UserEmail: "test@example.com"
          UserName: "test-user"
          GitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert action completed with SkipScriptFile
        run: |
          echo "Action completed with SkipScriptFile=true"
          echo "PASS: SkipScriptFile flag respected"
