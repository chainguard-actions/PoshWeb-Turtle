name: Test TargetBranch input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/act-harness
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true
      - name: Configure git
        run: |
          git config --global user.email "test@example.com"
          git config --global user.name "Test User"
      - id: action
        uses: .
        with:
          Run: |
            Write-Host "Running on target branch"
          TargetBranch: "turtle-target-branch-test"
          NoPush: "true"
          NoCommit: "true"
          UserEmail: "test@example.com"
          UserName: "TestUser"
      - name: Assert action completed without error
        run: |
          echo "Action step completed"
          echo "PASS"
