name: Test TargetBranch input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Set up git identity and local origin for git pull
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          # Create a bare repo as origin so git pull works during the action
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"
      - id: action
        uses: .
        with:
          Run: |
            Write-Host "TargetBranch test: running on target branch"
          TargetBranch: "test-target-branch-ci"
          NoPush: 'true'
          NoCommit: 'true'
          UserEmail: "test@example.com"
          UserName: "TestUser"
      - name: Assert action completed successfully
        run: |
          echo "Action completed with TargetBranch input"
          echo "PASS"
