name: Test NoCommit input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Install PowerShell if not available
        run: |
          if ! command -v pwsh &>/dev/null; then
            echo "Installing PowerShell..."
            wget -q "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"
            sudo dpkg -i packages-microsoft-prod.deb
            sudo apt-get update -q
            sudo apt-get install -y powershell
          else
            echo "pwsh already available: $(pwsh --version)"
          fi

      - name: Set up git and origin reachable for git pull
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          git config pull.rebase false
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"
          git fetch origin
          git branch --set-upstream-to=origin/act-harness act-harness 2>/dev/null || true

      - id: action
        uses: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: github-actions[bot]
          GITHUB_ACTOR_ID: "41898282"
        with:
          Run: |
            # Write a file to the workspace
            $outputFile = Join-Path $env:GITHUB_WORKSPACE "turtle-output.txt"
            "Generated by Turtle at $(Get-Date)" | Set-Content $outputFile
            Write-Host "Created output file: $outputFile"
          NoPush: "true"
          NoCommit: "true"
          UserEmail: "test@example.com"
          UserName: "Test User"
          GitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert output file was created
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/turtle-output.txt" ]; then
            echo "FAIL: expected turtle-output.txt to exist"
            exit 1
          fi
          echo "PASS: turtle-output.txt was created"

      - name: Assert file was NOT committed (NoCommit=true)
        run: |
          STATUS=$(git status --porcelain turtle-output.txt 2>/dev/null || true)
          echo "git status: '$STATUS'"
          LAST_COMMIT_FILES=$(git show --name-only --format="" HEAD 2>/dev/null || true)
          echo "Last commit files: $LAST_COMMIT_FILES"
          if echo "$LAST_COMMIT_FILES" | grep -q "turtle-output.txt"; then
            echo "FAIL: turtle-output.txt was committed but NoCommit=true was set"
            exit 1
          fi
          echo "PASS: file was not committed as expected"
