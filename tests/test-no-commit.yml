name: Test NoCommit input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/act-harness
      GITHUB_ACTOR: test-user
      GITHUB_ACTOR_ID: ""
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install PowerShell
        run: |
          which pwsh || (apt-get update -y && apt-get install -y powershell)
      - name: Configure git remote so git pull succeeds
        run: |
          git config --global user.email "test@example.com"
          git config --global user.name "test-user"
          git init --bare /tmp/test-remote.git
          git remote remove origin 2>/dev/null || true
          git remote add origin /tmp/test-remote.git
          git push --set-upstream origin act-harness
      - name: Record initial commit count
        id: before
        run: |
          COUNT=$(git log --oneline | wc -l | tr -d ' ')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        with:
          Run: |
            Write-Host "Running with NoCommit=true"
            "No commits will be made" | Out-Host
          NoCommit: "true"
          UserEmail: "test@example.com"
          UserName: "test-user"
      - name: Assert no new commits were made
        env:
          BEFORE: ${{ steps.before.outputs.count }}
        run: |
          AFTER=$(git log --oneline | wc -l | tr -d ' ')
          echo "Commits before: $BEFORE"
          echo "Commits after: $AFTER"
          if [ "$AFTER" -gt "$BEFORE" ]; then
            echo "FAIL: NoCommit=true but new commits were made"
            exit 1
          fi
          echo "PASS: NoCommit prevented any new commits"
