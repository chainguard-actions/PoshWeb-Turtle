name: Test NoCommit input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install PowerShell if needed
        run: |
          if ! command -v pwsh &>/dev/null; then
            apt-get update -qq 2>/dev/null || sudo apt-get update -qq
            apt-get install -y -qq powershell 2>/dev/null || sudo apt-get install -y -qq powershell
          fi
          pwsh --version

      - name: Set up git origin reachable inside the action
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"
          # Set up tracking so git pull works
          CURRENT_BRANCH=$(git symbolic-ref --short HEAD 2>/dev/null || echo "act-harness")
          git fetch origin
          git branch --set-upstream-to="origin/$CURRENT_BRANCH" "$CURRENT_BRANCH" 2>/dev/null || true

      - name: Run action with NoCommit=true and a script that writes output
        id: action
        uses: .
        with:
          Run: |
            Write-Host "Running with NoCommit flag"
            $testFile = Join-Path $env:GITHUB_WORKSPACE "test-output.txt"
            "test content" | Out-File -FilePath $testFile
            Write-Host "Wrote test file"
          NoCommit: 'true'
          NoPush: 'true'
          UserEmail: 'test@example.com'
          UserName: 'test-user'

      - name: Assert no new commits were made
        run: |
          COMMIT_COUNT=$(git log --oneline | wc -l)
          echo "Commit count: $COMMIT_COUNT"

          # Check that the test file was written (script ran)
          if [ ! -f "$GITHUB_WORKSPACE/test-output.txt" ]; then
            echo "FAIL: test-output.txt was not created by the script"
            exit 1
          fi
          echo "PASS: Script ran and created output file, no commit was made"

      - name: Assert git status shows uncommitted changes (NoCommit respected)
        run: |
          GIT_STATUS=$(git status --porcelain)
          echo "Git status: $GIT_STATUS"
          if echo "$GIT_STATUS" | grep -q "test-output.txt"; then
            echo "PASS: File is uncommitted as expected with NoCommit=true"
          else
            echo "INFO: File may have been committed or not present in status"
            echo "Git log:"
            git log --oneline -5
          fi
